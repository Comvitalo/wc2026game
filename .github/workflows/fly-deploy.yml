name: Deploy to Fly

# Deploy on merge to the default branch, or on demand via the
# "Run workflow" button in the Actions tab.
on:
  push:
    branches:
      - claude/gracious-wright-atyhu5
  workflow_dispatch:

# Never run two deploys at once (SQLite app = single instance).
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
